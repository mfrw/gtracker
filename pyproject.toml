[project]
name = "gtracker"
version = "0.1.0"
description = "Mirror Git tracking branches and explicitly rebase local work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gtracker = "gtracker.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["gtracker"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gtracker"]
