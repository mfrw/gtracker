name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.11"
            minimum-git: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build minimum supported Git
        if: matrix.minimum-git
        env:
          GIT_VERSION: 2.45.0
          # https://www.kernel.org/pub/software/scm/git/sha256sums.asc
          GIT_SHA256: 0aac200bd06476e7df1ff026eb123c6827bc10fe69d2823b4bf2ebebe5953429
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev
          archive="$RUNNER_TEMP/git-$GIT_VERSION.tar.xz"
          curl --fail --silent --show-error --location \
            "https://www.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$GIT_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-$GIT_VERSION" -j2 \
            prefix="$RUNNER_TEMP/minimum-git" CFLAGS="-O2 -std=gnu11" \
            NO_TCLTK=YesPlease NO_GETTEXT=YesPlease install
          echo "$RUNNER_TEMP/minimum-git/bin" >> "$GITHUB_PATH"

      - name: Set up uv and selected Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install locked development environment
        run: |
          uv python install "${{ matrix.python }}"
          uv sync --locked --python "${{ matrix.python }}" --group dev

      - name: Report tool versions
        run: |
          git --version
          uv --version
          uv run --locked python --version

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check strict types
        run: uv run --locked mypy --strict src/gtracker

      - name: Test with coverage
        run: uv run --locked pytest --cov=gtracker --cov-report=term-missing --cov-fail-under=80

      - name: Build distributions
        run: uv build --python "${{ matrix.python }}"
